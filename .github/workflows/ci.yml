name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Axiom audit
        run: lake build KnightModel.Meta.AxiomsAudit
